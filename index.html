<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b3a">
<title>Shahid Sharing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0f1b3a; --ink2:#1b2a52; --paper:#f2f6fa; --card:#ffffff; --line:#d9e1ec;
  --text:#18233d; --mute:#66728a; --get:#0e8a5f; --give:#c8344b; --accent:#13a39c; --accent2:#2f6fed;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:92px}
@media (min-width:900px){#app{max-width:720px}.nav .in{max-width:720px}.chatbar{max-width:720px}.sheet{max-width:640px}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;
  background:linear-gradient(160deg,#0f1b3a,#16365f);color:#fff;max-width:560px;margin:0 auto}
.login h1{font-size:34px;line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
.login p{margin:0 0 28px;color:#a9bbd6}
.login label{display:block;font-size:14px;color:#c9d6ea;margin:14px 0 6px}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #36527f;background:#1b2f58;color:#fff}
.login input:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--ink);color:#fff}
.btn.gold{background:var(--accent);color:#fff;width:100%;margin-top:22px;padding:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:#ffb4c0;font-size:14px;margin-top:12px;min-height:20px}

/* header + balance */
.top{background:linear-gradient(160deg,#0f1b3a,#173a63);color:#fff;padding:14px 16px 20px;border-radius:0 0 22px 22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .who{font-size:14px;color:#a9bbd6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .who b{color:#fff}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:14px;position:relative}
.icon-btn .dot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:#ff6b81}
.balance{margin-top:14px}
.balance .lbl{font-size:14px;color:#a9bbd6}
.balance .amt{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.balance .amt small{font-size:16px;font-weight:500;margin-left:6px;color:#a9bbd6}
.balance.get .amt{color:#5fe0ae}
.balance.give .amt{color:#ff8fa1}

.wrap{padding:16px}
.monthbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.monthbar input{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.lockpill{background:#fff2d1;color:#7a5600;border-radius:10px;padding:8px 12px;font-size:14px;margin:-4px 0 14px}
.info{background:#e4f4f6;border:1px solid #b9e3e7;color:#0c4f56;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.stat{display:flex;gap:10px;margin-bottom:14px}
.stat>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat .k{font-size:13px;color:var(--mute)}
.stat .v{font-size:20px;font-weight:700}

h2{font-size:17px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:14px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.s{font-size:13px;color:var(--mute)}
.li .r{text-align:right;white-space:nowrap}
.get{color:var(--get)} .give{color:var(--give)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#e6edf5;color:var(--mute)}
.pill.off{background:#fbe3e7;color:var(--give)}
.pill.adm{background:#fff2d1;color:#7a5600}
.pill.ok{background:#dff5ea;color:var(--get)}
.pill.warn{background:#fff2d1;color:#7a5600}
.empty{padding:22px 16px;text-align:center;color:var(--mute)}
.pay{padding:10px 14px;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.back{margin-bottom:12px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:#e9eff6;font-size:13px;margin:3px 4px 0 0}

/* segmented */
.segbar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.segbar::-webkit-scrollbar{display:none}
.segbar button{flex:1;min-width:max-content;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px}
.segbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* avatar */
.av{display:inline-flex;border-radius:50%;overflow:hidden;flex:none;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#13a39c,#2f6fed);color:#fff}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ph svg{width:56%;height:56%}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5;box-shadow:0 -4px 16px rgba(15,27,58,.06)}
.nav .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;border:0;background:none;padding:7px 2px 8px;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center}
.tab .ic{display:flex;align-items:center;justify-content:center;padding:3px 16px;border-radius:14px;transition:background .2s,color .2s}
.tab.on{color:var(--accent);font-weight:700}
.tab.on .ic{background:#dff3f2}
.tab:active .ic{transform:scale(.94)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--give);color:#fff;font-size:11px;line-height:18px;margin-left:3px;font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:82px;z-index:6;border:0;border-radius:99px;
  background:var(--accent);color:#fff;font-weight:700;padding:14px 20px;box-shadow:0 6px 18px rgba(15,27,58,.3)}

/* drawer */
.dr-ov{position:fixed;inset:0;background:rgba(8,16,36,.55);z-index:40}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(310px,86vw);background:var(--card);overflow:auto;padding-bottom:20px}
.dr-head{background:linear-gradient(160deg,#0f1b3a,#173a63);color:#fff;padding:22px 16px 16px;display:flex;gap:12px;align-items:center}
.dr-head .nm{font-weight:700;font-size:17px}
.dr-head button.avb{background:none;border:0;padding:0;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.dr-s{padding:14px 16px 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.dr-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 16px;border-left:4px solid transparent;color:var(--text)}
.dr-i svg{color:var(--mute);flex:none}
.dr-i.on{background:#e4f4f6;border-left-color:var(--accent);font-weight:700}
.dr-i.on svg{color:var(--accent)}
.dr-i .sp{flex:1}

/* tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{background:#eaf1f8;text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr.pend td{background:#fffaf0;color:var(--mute)}
.tbl tfoot td{font-weight:700;background:#f4f8fc}
.txc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;border-left:5px solid var(--get)}
.txc.pend{border-left-color:#e0a21b;background:#fffaf0}
.txc .big{font-size:19px;font-weight:700}


/* excel jaisa grid */
.xl{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:#fff;-webkit-overflow-scrolling:touch}
.xlt{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.xlt th,.xlt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 8px;min-width:74px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.xlt thead th{position:sticky;top:0;background:#e6eef7;z-index:2;text-align:center;max-width:96px;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.xlt .gd{position:sticky;left:0;background:#f1f6fb;z-index:1;text-align:left;min-width:64px;font-weight:600}
.xlt thead .gd{z-index:3;background:#e6eef7}
.xlt td.has{background:#e3f6f4;font-weight:700;color:var(--ink);cursor:pointer;position:relative}
.xlt td.has::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent #e5484d transparent transparent}
.xlt td.tt,.xlt th.tt{background:#f1f6fb;font-weight:700}
.xlt tr.tod .gd{background:#fff0c9}
.xlt tr.tod td:not(.has){background:#fffaf0}
.xlt tfoot td,.xlt tfoot th{position:sticky;bottom:0;background:#e6eef7;font-weight:700;z-index:2}
.xlt tfoot .gd{z-index:3}
/* charts */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.bar{height:10px;border-radius:6px;background:#e6edf5;overflow:hidden;margin-top:6px}
.bar>div{height:100%;border-radius:6px}
.carry{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin:-4px 0 14px}
.carry input{width:auto}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stp{font-size:12px;padding:3px 9px;border-radius:99px;background:#e9eff6;color:var(--mute)}
.stp.ok{background:#dff5ea;color:var(--get)}
.stp.wait{background:#fff2d1;color:#7a5600}
.stp.bad{background:#fbe3e7;color:var(--give)}

/* status */
.sring{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.sring::-webkit-scrollbar{display:none}
.sitem{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:68px;flex:none;padding:0;font-size:12px;color:var(--text)}
.sitem span.nmx{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#13a39c,#2f6fed);position:relative}
.ring.seen{background:#c5cfdd}
.ring.none{background:#e6edf5}
.ring .av{border:2px solid #fff}
.ring .plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid #fff;font-size:16px;line-height:1}
.kbadge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#e9eff6;color:var(--ink2);flex:none}
.kbadge.photo{background:#e2eefe;color:#2f6fed}
.kbadge.video{background:#fde8f0;color:#c0306a}
.kbadge.text{background:#e4f4f6;color:var(--accent)}
.viewer{position:fixed;inset:0;background:#0a1226;z-index:60;display:flex;flex-direction:column;color:#fff}
.viewer .vh{padding:12px 14px calc(8px);display:flex;flex-direction:column;gap:8px}
.viewer .prog{display:flex;gap:4px}
.viewer .prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.viewer .prog i.on{background:#fff}
.viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.viewer .vb img,.viewer .vb video{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vtext{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;font-size:24px;
  background:linear-gradient(160deg,#13a39c,#2f6fed);word-break:break-word;white-space:pre-wrap}
.viewer .vcap{padding:12px 16px calc(18px + env(safe-area-inset-bottom));text-align:center;min-height:56px}
.viewer .nv{position:absolute;top:0;bottom:0;width:26%;background:none;border:0}
.viewer .nv.l{left:0}.viewer .nv.r{right:0}
.viewer .vclose{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 12px}

/* food */
.food{border:2px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px;margin-bottom:12px}
.food.today{border-color:var(--accent);background:linear-gradient(180deg,#eaf8f7,#fff)}
.food.tomorrow{border-color:#9fb8e8;background:linear-gradient(180deg,#eff4fd,#fff)}
.food h3{margin:0 0 4px;font-size:16px}
.food .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent);color:#fff;margin-left:6px}
.food.tomorrow .tag{background:#2f6fed}
.meal{margin-top:10px}
.meal b{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.meal ul{margin:4px 0 0;padding-left:20px}
.meal li{margin:2px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal.head{margin-bottom:4px;text-align:center;font-size:12px;color:var(--mute)}
.cal .c{min-height:60px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px;font-size:11px;
  text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:2px;line-height:1.15}
.cal .c b{font-size:13px}
.cal .c.today{outline:2px solid var(--accent)}
.cal .c.sel{background:#e4f4f6}
.cal .c.past{opacity:.6}
.cal .c .dn{color:var(--ink2);word-break:break-word}
.cal .c .more{color:var(--accent);font-weight:700}

/* chat */
.chatlist{padding-bottom:70px}
.msg{display:flex;margin-bottom:8px}
.msg.me{justify-content:flex-end}
.bub{max-width:80%;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;word-break:break-word;white-space:pre-wrap}
.msg.me .bub{background:#dff3f2;border-color:#bfe6e3;border-radius:14px 14px 4px 14px}
.bub .nm{font-size:12px;font-weight:700;color:var(--ink2)}
.bub .tm{font-size:11px;color:var(--mute);text-align:right;margin-top:2px}
.bub .tm a{margin-left:6px;color:var(--give)}
.dsep{text-align:center;font-size:12px;color:var(--mute);margin:10px 0}
.chatbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px;
  padding:8px 12px;background:var(--paper);max-width:560px;margin:0 auto}
.chatbar input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.ann.urgent{border-color:var(--give);background:#fff6f7}
.ann .body{margin-top:6px;white-space:pre-wrap;word-break:break-word}
.sw{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw input{width:20px;height:20px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,16,36,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.sheet h3{margin:0 0 12px;font-size:19px}
.f label{display:block;font-size:14px;color:var(--mute);margin:12px 0 5px}
.f input,.f select,.f textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.f textarea{min-height:90px;resize:vertical}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--text);font-size:14px}
.chk input{width:auto}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;margin:0;padding:11px 6px;border:1px solid var(--line);border-radius:12px;color:var(--text)}
.seg input{width:auto}
.preview{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px;background:#e9eff6}
.optbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#f4f8fc;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.optbtn[disabled]{opacity:.45}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:70;font-size:14px;max-width:90%;text-align:center}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fe0ae;margin-right:6px}
.live.off{background:#ff8fa1}

@media print{
  .nav,.fab,.top .icon-btn,.monthbar button,.noprint,.acts,.chatbar{display:none!important}
  body{background:#fff} .top{background:#fff;color:#000;border-bottom:2px solid #000;border-radius:0}
  .top .who,.balance .lbl{color:#444}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}.drawer{animation:slide .2s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}

/* ===== v6 polish: same layout, better look and graphics ===== */
body{background:linear-gradient(180deg,#f3f7fc 0,#e7eff8 100%) fixed;letter-spacing:.005em}
.login{position:relative;overflow:hidden;background:radial-gradient(circle at 88% 6%,rgba(19,163,156,.38),transparent 46%),radial-gradient(circle at 8% 92%,rgba(47,111,237,.38),transparent 52%),linear-gradient(160deg,#0f1b3a,#16365f)}
.login::before,.login::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.login::before{width:240px;height:240px;right:-80px;top:120px}
.login::after{width:160px;height:160px;left:-50px;bottom:140px}
.login>*{position:relative;z-index:1}
.lart{width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#13a39c,#2f6fed);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 12px 28px rgba(0,0,0,.35);color:#fff}
.login input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.btn{background:linear-gradient(135deg,#1d3a78,#0f1b3a);box-shadow:0 3px 8px rgba(15,27,58,.25);transition:transform .12s ease,box-shadow .2s ease,filter .2s}
.btn:active{transform:scale(.97);box-shadow:0 1px 3px rgba(15,27,58,.3)}
.btn.gold{background:linear-gradient(135deg,#13a39c,#2f6fed);box-shadow:0 8px 20px rgba(19,163,156,.35)}
.btn.ghost{background:#fff;box-shadow:none;color:var(--ink)}
.top{position:relative;overflow:hidden;background:linear-gradient(160deg,#0f1b3a 0,#173a63 58%,#1a6a86 100%);box-shadow:0 10px 26px rgba(15,27,58,.22)}
.top::before{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(19,163,156,.6),transparent 70%)}
.top::after{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(47,111,237,.5),transparent 70%)}
.top>*{position:relative;z-index:1}
.icon-btn{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);transition:background .2s}
.balance{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:12px 14px}

<div id="app"></div>

<script>
/* ====== SETTINGS ====== */
const SUPABASE_URL = 'https://zxoteqccatlddglcnjdl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BFD2Vrf9aU756NjACFVTrw_ll2se_gz';   // publishable key (public hoti hai)
const DOMAIN = '@shahidsharing.com';
const CURRENCY = 'KWD';
const CATS = ['Khana','Grocery','Bijli/Paani','Gas','Saaman','Transport','Other'];
const FOOD_CATS = ['Khana','Grocery'];
const COLORS = ['#0f1b3a','#13a39c','#2f6fed','#c8344b','#e9b44c','#9b5de5','#f15bb5','#00a6a6'];
const IMG_TYPES = ['image/jpeg','image/png','image/webp'];
const VID_TYPES = ['video/mp4','video/webm','video/quicktime'];
/* ====================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const fmt = n => (Number(n) || 0).toFixed(3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const p2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const plusDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); const x = new Date(y, m - 1, d + n); return x.getFullYear() + '-' + p2(x.getMonth() + 1) + '-' + p2(x.getDate()); };
const dow = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const weekStart = s => plusDays(s, -dow(s));                    // week Sunday se shuru
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayName = s => WD[dow(s)];
const dmy = s => s.slice(8) + '/' + s.slice(5, 7);
const ftime = iso => new Date(iso).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
const fdt = iso => { const d = new Date(iso); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' ' + ftime(iso); };
const fday = iso => { const d = new Date(iso); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); };
const after = (a, b) => !b || new Date(a) > new Date(b);
const errMsg = e => (e && e.message) ? e.message : 'Kuch gadbad hui';
function range(m){ const [y, mo] = m.split('-').map(Number); const last = new Date(y, mo, 0).getDate(); return [m + '-01', m + '-' + p2(last)]; }
function addMonths(m, n){ const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); }
function monthDates(m){ const [a, b] = range(m); const out = []; for (let d = a; d <= b; d = plusDays(d, 1)) out.push(d); return out; }
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3400); }
const loadImg = file => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Photo khul nahi paayi')); i.src = URL.createObjectURL(file); });
const hasType = (f, types, exts) => types.includes(f.type) || (!f.type && exts.test(f.name || ''));

/* ---------- ICONS (ek jaisa style) ---------- */
const IC = {
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14" r="1"/>',
 coins:'<circle cx="12" cy="12" r="9"/><path d="M8 16l8-8M9 8h7v7"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 status:'<circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="4"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',
 mega:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>',
 backup:'<path d="M7 18a4 4 0 0 1-.5-7.9A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z"/><path d="M12 16v-5M9.5 13l2.5-2.5 2.5 2.5"/>',
 rent:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
 food:'<path d="M7 3v8a2 2 0 0 0 2 2v8"/><path d="M5 3v6M9 3v6"/><path d="M17 3c-2 2-3 5-3 8h3v10"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c3 0 4.5 1.8 4.5 4.5"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
 chart:'<path d="M4 20V4"/><path d="M4 20h16"/><rect x="8" y="12" width="3" height="5"/><rect x="13" y="8" width="3" height="9"/>',
 camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
 text:'<path d="M5 6h14M12 6v13M9 19h6"/>'
};
const ic = (n, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ''}</svg>`;

/* ---------- STATE ---------- */
const S = { me:null, members:[], expenses:[], summary:[], xfers:[], reqs:[], cat:[], phones:{}, locks:new Set(),
  ledger:[], statuses:[], chat:[], anns:[], rentDues:[], rentPays:[], food:[], meals:['Dinner'], backups:[], actlog:[],
  prefs:{ announcements_on:true, chat_on:true, ann_seen_at:null, chat_seen_at:null },
  knownAnn:null, lastPend:null, carry:false, tab:'home', month:todayStr().slice(0, 7), live:false,
  hv:lsGet('ss_hv') === 'list' ? 'list' : 'table', hSort:{ k:'day', d:-1 }, hCat:'',
  fView:'today', fDate:todayStr(), fMonth:todayStr().slice(0, 7), fWeek:weekStart(todayStr()),
  chatDraft:'', chatFocus:false, pwq:'', dishPhotos:{}, fTab:'home', showPay:false, _enter:false, foodFrom:'', foodTo:'' };
let channel = null;

const isAdmin = () => !!S.me && S.me.role === 'admin';
const nameOf = id => (S.members.find(m => m.id === id) || { name:'(hata hua)' }).name;
const memberOf = id => S.members.find(m => m.id === id);
const advTxt = r => Number(r.advance || 0) ? ' · Advance ' + (Number(r.advance) > 0 ? '+' : '') + fmt(r.advance) : '';
const pendCount = () => S.reqs.filter(r => r.status === 'pending').length;
const pendAnn = () => S.anns.filter(a => a.status === 'pending').length;
const chatUnread = () => S.prefs.chat_on ? S.chat.filter(c => c.sender !== S.me.id && after(c.created_at, S.prefs.chat_seen_at)).length : 0;
const annUnread = () => S.prefs.announcements_on ? S.anns.filter(a => a.status === 'approved' && a.author !== S.me.id && after(a.reviewed_at || a.created_at, S.prefs.ann_seen_at)).length : 0;

/* ---------- AVATAR ---------- */
const avUrl = m => (m && m.avatar_path) ? sb.storage.from('avatars').getPublicUrl(m.avatar_path).data.publicUrl : '';
function av(m, size = 40){
  const u = avUrl(m);
  return u ? `<span class="av" style="width:${size}px;height:${size}px"><img src="${esc(u)}" alt="" loading="lazy"></span>`
           : `<span class="av ph" style="width:${size}px;height:${size}px">${ic('user', Math.round(size * .56))}</span>`;
}

/* ---------- AUTH ---------- */
function showLogin(msg){
  if (channel){ sb.removeChannel(channel); channel = null; }
  $('#app').innerHTML = `
  <div class="login">
    <div class="lart">${ic('wallet', 34)}</div>
    <h1>Shahid<br>Sharing</h1>
    <p>Share Expenses. Track Everything. Settle Easily.</p>
    <form id="lf">
      <label for="u">Username</label>
      <input id="u" autocomplete="username" autocapitalize="none" required>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <div class="err" id="le">${esc(msg || '')}</div>
      <button class="btn gold" type="submit">Login karo</button>
    </form>
  </div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    $('#le').textContent = 'Login ho raha hai...';
    let uname = $('#u').value.trim().toLowerCase();
    if (uname.includes('@')) uname = uname.split('@')[0];
    const { error } = await sb.auth.signInWithPassword({ email: uname + DOMAIN, password: $('#p').value });
    if (error) $('#le').textContent = 'Username ya password galat hai.';
    else boot();
  };
}
async function logout(){ await sb.auth.signOut(); S.me = null; S.lastPend = null; S.knownAnn = null; closeDrawer(); showLogin(); }
window.logout = logout;

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !data || !data.active){
    await sb.auth.signOut();
    return showLogin('Aapka account active nahi hai. Admin se baat karo.');
  }
  S.me = data;
  await loadAll();
  subscribe();
}

/* ---------- DATA ---------- */
async function loadAll(){
  const [from, to] = range(S.month), t0 = todayStr();
  const fMo = range(S.fMonth), fwk = S.fWeek;
  const fFrom = [fMo[0], fwk, plusDays(t0, -60)].sort()[0];
  const fTo = [fMo[1], plusDays(fwk, 6), plusDays(t0, 60)].sort().pop();
  S.foodFrom = fFrom; S.foodTo = fTo;
  const q = [
    sb.from('profiles').select('*').order('name'),                                                       // 0
    sb.from('expenses').select('*').gte('date', from).lte('date', to)
      .order('date', {ascending:false}).order('created_at', {ascending:false}),                          // 1
    sb.rpc('get_summary', { p_from: S.carry ? '2000-01-01' : from, p_to: to }),                         // 2
    sb.from('transfers').select('*').gte('date', from).lte('date', to)
      .order('date', {ascending:false}).order('created_at', {ascending:false}),                          // 3
    sb.from('expense_requests').select('*').order('created_at', {ascending:false}).limit(100),          // 4
    sb.from('month_locks').select('month'),                                                              // 5
    sb.rpc('get_category_totals', { p_from: addMonths(S.month, -5) + '-01', p_to: to }),                // 6
    sb.rpc('get_ledger', { p_from: from, p_to: to }),                                                   // 7
    sb.from('statuses').select('*').order('created_at', {ascending:false}).limit(200),                  // 8
    sb.from('chat_messages').select('*').order('created_at', {ascending:false}).limit(100),             // 9
    sb.from('announcements').select('*').order('created_at', {ascending:false}).limit(100),             // 10
    sb.from('member_prefs').select('*').eq('member_id', S.me.id).maybeSingle(),                         // 11
    sb.from('rent_dues').select('*').eq('month', S.month),                                               // 12
    sb.from('rent_payments').select('*').eq('month', S.month).order('paid_on'),                          // 13
    sb.from('food_menu').select('*').gte('menu_date', fFrom).lte('menu_date', fTo)
      .order('menu_date').order('sort').limit(3000),                                                     // 14
    sb.from('app_settings').select('*').eq('key', 'meals').maybeSingle(),                               // 15
    sb.from('dish_photos').select('*')                                                                   // 16
  ];
  if (isAdmin()){
    q.push(sb.from('member_phones').select('*'));                                                        // 16
    q.push(sb.from('backups').select('id,kind,created_at').order('created_at', {ascending:false}).limit(40)); // 17
    q.push(sb.from('admin_activity_log').select('*').order('created_at', {ascending:false}).limit(150)); // 18
  }
  const R = await Promise.all(q);
  const [m, e, s, x, rq, lk, ct, lg, st, ch, an, pf, rd, rp, fm, ms, dp, ph, bk, al] = R;
  if (m.data) S.members = m.data;
  if (e.data) S.expenses = e.data;
  if (s.data) S.summary = s.data;
  if (x.data) S.xfers = x.data;
  if (rq.data) S.reqs = rq.data;
  if (lk.data) S.locks = new Set(lk.data.map(r => r.month));
  if (ct.data) S.cat = ct.data;
  if (lg.data) S.ledger = lg.data;
  if (st.data) S.statuses = st.data;
  if (ch.data) S.chat = ch.data.slice().reverse();
  if (an.data) S.anns = an.data;
  if (pf && !pf.error) S.prefs = Object.assign({ announcements_on:true, chat_on:true, ann_seen_at:null, chat_seen_at:null }, pf.data || {});
  if (rd.data) S.rentDues = rd.data;
  if (rp.data) S.rentPays = rp.data;
  if (fm.data) S.food = fm.data;
  if (ms && ms.data && Array.isArray(ms.data.value) && ms.data.value.length) S.meals = ms.data.value;
  if (dp && dp.data){ S.dishPhotos = {}; dp.data.forEach(d => S.dishPhotos[d.name_key] = d); }
  if (ph && ph.data){ S.phones = {}; ph.data.forEach(p => S.phones[p.member_id] = p.phone); }
  if (bk && bk.data) S.backups = bk.data;
  if (al && al.data) S.actlog = al.data;
  const mine = S.members.find(z => z.id === S.me.id);
  if (mine) S.me = mine;
  if (m.data && (!mine || !mine.active)) return logout();

  const pend = isAdmin() ? pendCount() : 0;
  if (isAdmin() && S.lastPend !== null && pend > S.lastPend) toast('Naya bill request aayi hai');
  S.lastPend = pend;
  if (an.data){
    const ids = new Set(an.data.map(a => a.id));
    if (S.knownAnn){
      an.data.filter(a => !S.knownAnn.has(a.id) && a.author !== S.me.id).forEach(a => {
        if (a.status === 'pending' && isAdmin()) toast('Naya announcement check ke liye aaya');
        else if (a.status === 'approved' && S.prefs.announcements_on) toast('Naya announcement: ' + a.title);
      });
    }
    S.knownAnn = ids;
  }
  await purgeExpired();
  render();
}

function subscribe(){

/* ---------- SETTLEMENT SUGGESTION ---------- */
function transfers(){
  const give = [], get = [];
  S.summary.forEach(r => {
    const n = Math.round(Number(r.net) * 1000) / 1000;
    if (n <= -0.0005) give.push({ name:r.name, amt:-n });
    else if (n >= 0.0005) get.push({ name:r.name, amt:n });
  });
  give.sort((a, b) => b.amt - a.amt); get.sort((a, b) => b.amt - a.amt);
  const out = []; let i = 0, j = 0;
  while (i < give.length && j < get.length){
    const x = Math.min(give[i].amt, get[j].amt);
    if (x >= 0.0005) out.push({ from:give[i].name, to:get[j].name, amt:x });
    give[i].amt -= x; get[j].amt -= x;
    if (give[i].amt < 0.0005) i++;
    if (get[j].amt < 0.0005) j++;
  }
  return out;
}

  let out = cat ? rows.filter(r => r.cat === cat) : rows.slice();

    let x = a[k], y = b[k];
    if (x == null) x = -Infinity; if (y == null) y = -Infinity;

/* Automated validation: sirf photo ki quality jaanch (browser me). Bill sahi hai ya nahi, ye approval se tay hota hai. */
async function autoCheck(file){
  const res = { ok:true, fail:[], warnings:[], at:new Date().toISOString() };
  if (!hasType(file, IMG_TYPES, /\.(jpe?g|png|webp)$/i)) res.fail.push('Sirf JPG, PNG ya WebP photo chalegi');
  if (file.size > 12 * 1024 * 1024) res.fail.push('Photo 12 MB se badi hai');
  if (!res.fail.length){
    try {
      const img = await loadImg(file); res.w = img.width; res.h = img.height;
      if (Math.min(img.width, img.height) < 600) res.fail.push('Photo ka size bahut chhota hai (kam se kam 600 pixel chahiye)');
      const sc = Math.min(1, 320 / Math.max(img.width, img.height)), w = Math.max(16, Math.round(img.width * sc)), h = Math.max(16, Math.round(img.height * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
      const px = cx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h); let mean = 0;
      for (let i = 0; i < w * h; i++){ g[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]; mean += g[i]; }
      mean /= w * h; let s = 0, s2 = 0, n = 0;
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++){
        const l = 4 * g[y * w + x] - g[y * w + x - 1] - g[y * w + x + 1] - g[(y - 1) * w + x] - g[(y + 1) * w + x]; s += l; s2 += l * l; n++; }
      const blur = n ? (s2 / n - (s / n) * (s / n)) : 0;
      res.blur = Math.round(blur); res.brightness = Math.round(mean);
      if (blur < 25) res.warnings.push('Photo dhundhli lag rahi hai');
      if (mean < 45) res.warnings.push('Photo bahut andheri hai');
      if (mean > 235) res.warnings.push('Photo me bahut zyada roshni hai');
    } catch (e) { res.fail.push(errMsg(e)); }
  }
  res.ok = !res.fail.length;
  return res;
}

async function compress(file, max = 1600, q = 0.8){
  const img = await loadImg(file), sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', q));
}

/* ---------- ANALYSIS CHART ---------- */
function vChart(){
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonths(S.month, -i));
  const tot = {}; S.cat.forEach(r => tot[r.category] = (tot[r.category] || 0) + Number(r.total));
  const cats = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
  const col = c => COLORS[cats.indexOf(c) % COLORS.length];
  const val = (m, c) => S.cat.filter(r => r.month === m && r.category === c).reduce((a, r) => a + Number(r.total), 0);
  const mt = months.map(m => cats.reduce((a, c) => a + val(m, c), 0));
  const max = Math.max(...mt, 1);
  const W = 340, H = 190, pad = 22, bw = 34, gap = (W - pad * 2 - bw * 6) / 5;
  let svg = `<svg viewBox="0 0 ${W} ${H + 28}" width="100%" role="img" aria-label="Mahine wise kharcha">`;
  months.forEach((m, i) => {
    const x = pad + i * (bw + gap); let y = H;
    cats.forEach(c => { const v = val(m, c), h = v / max * H;
      if (h > 0){ y -= h; svg += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${col(c)}"><title>${esc(c)}: ${fmt(v)}</title></rect>`; } });
    svg += `<text x="${x + bw / 2}" y="${H + 16}" text-anchor="middle" font-size="11" fill="currentColor">${m.slice(5)}/${m.slice(2, 4)}</text>`;
    if (mt[i]) svg += `<text x="${x + bw / 2}" y="${H - mt[i] / max * H - 4}" text-anchor="middle" font-size="10" fill="currentColor">${Math.round(mt[i])}</text>`;
  });
  svg += `<line x1="${pad - 4}" x2="${W - pad + 4}" y1="${H}" y2="${H}" stroke="#d9e1ec"/></svg>`;
  const curTot = mt[5], prevTot = mt[4];
  const rows = cats.map(c => ({ c, v: val(S.month, c) })).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  const change = prevTot > 0 ? ((curTot - prevTot) / prevTot * 100) : null, top = rows[0];
  $('#view').innerHTML = `<button class="btn ghost sm back noprint" onclick="go('more')">&larr; Wapas</button>${monthBar()}
  ${S.cat.length ? `
  <div class="stat"><div><div class="k">${S.month} ka total</div><div class="v num">${fmt(curTot)}</div></div>
    <div><div class="k">Pichhle mahine se</div><div class="v num ${change === null ? '' : change > 0 ? 'give' : 'get'}">${change === null ? '-' : (change > 0 ? '+' : '') + change.toFixed(0) + '%'}</div></div></div>
  ${top ? `<div class="stat"><div><div class="k">Sabse zyada kharcha</div><div class="v">${esc(top.c)} <span class="num" style="font-size:14px;color:var(--mute)">${(top.v / curTot * 100).toFixed(0)}%</span></div></div></div>` : ''}
  <h2>Pichhle 6 mahine</h2>
  <div class="card pad">${svg}<div class="legend">${cats.map(c => `<span><i style="background:${col(c)}"></i>${esc(c)}</span>`).join('')}</div></div>
  <h2>${S.month}: category wise</h2>
  <div class="card">${rows.length ? rows.map(r => `<div class="pay"><div class="row"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:${col(r.c)}"></i><b>${esc(r.c)}</b></span><span class="num">${fmt(r.v)} <span class="s">(${(r.v / curTot * 100).toFixed(0)}%)</span></span></div><div class="bar"><div style="width:${(r.v / curTot * 100).toFixed(1)}%;background:${col(r.c)}"></div></div></div>`).join('') : '<div class="empty">Is mahine koi kharcha nahi.</div>'}</div>`
  : '<div class="empty card">Abhi chart ke liye data nahi hai.</div>'}`;
}

  downloadBlob(new Blob(['\ufeff' + out], { type:'text/csv;charset=utf-8' }), 'shahid-sharing-' + S.month + '.csv');

async function squareCrop(file, size = 512, q = 0.85){
  const img = await loadImg(file), s = Math.min(img.width, img.height);
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', q));
}

    if (f.size > 10 * 1024 * 1024) return toast('Photo 10 MB se badi hai');
    try {

function renderChatList(){
  const l = $('#chatlist'); if (!l) return;

  const ci = $('#ci'); ci.value = S.chatDraft;

window.edPhoto = (m, i) => {
  const name = (ED.draft[m][i] || '').trim(); if (!name) return toast('Pehle dish ka naam likho');
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';

    if (!hasType(f, IMG_TYPES, /\.(jpe?g|png|webp)$/i)) return toast('Sirf JPG, PNG ya WebP photo chuno');
    if (f.size > 10 * 1024 * 1024) return toast('Photo 10 MB se badi hai');
    try {
      toast('Photo save ho rahi hai...');
      const blob = await compress(f, 1000, 0.82), path = Date.now() + '.jpg', old = S.dishPhotos[dkey(name)];
      const up = await sb.storage.from('dishes').upload(path, blob, { contentType:'image/jpeg' }); if (up.error) throw up.error;
      const row = { name_key:dkey(name), name, photo_path:path, updated_at:new Date().toISOString() };
      const r = await sb.from('dish_photos').upsert(row);
      if (r.error){ sb.storage.from('dishes').remove([path]); throw r.error; }

function copyWeekRows(food, meals, srcStart, dstStart){
  const rows = [];
  for (let i = 0; i < 7; i++){
    const s = plusDays(srcStart, i), d = plusDays(dstStart, i);
    const ms = [...new Set(meals.concat(food.filter(x => x.menu_date === s).map(x => x.meal)))];
    ms.forEach(m => rows.push({ date:d, meal:m, dishes:food.filter(x => x.menu_date === s && x.meal === m).sort((a, b) => a.sort - b.sort).map(x => x.dish) }));
  }
  return rows;
}
function monthRepeatRows(food, meals, srcStart, month, onlyEmpty){
  const rows = [];
  monthDates(month).forEach(d => {
    if (onlyEmpty && food.some(x => x.menu_date === d)) return;
    const s = plusDays(srcStart, dow(d));
    const ms = [...new Set(meals.concat(food.filter(x => x.menu_date === s).map(x => x.meal)))];

  });

}

async function runRestore(obj, label){
  if (!obj || obj.app !== 'shahid-sharing') return alert('Ye Shahid Sharing ki backup file nahi lag rahi.');
  const c = k => Array.isArray(obj[k]) ? obj[k].length : 0;
  if (!confirm(label + ' me: kharche ' + c('expenses') + ', advance ' + c('transfers') + ', rent due ' + c('rent_dues') + ', rent payment ' + c('rent_payments') + ', menu ' + c('food_menu') + '.\n\nSirf wo records jodenge jo abhi maujood nahi hain. Aage badhein?')) return;
  const { data, error } = await sb.rpc('restore_backup', { p_data:obj });
  if (error) return toast(errMsg(error));
  alert('Restore ho gaya.\nNaye jude: kharche ' + data.expenses + ', advance ' + data.transfers + ', rent due ' + data.rent_dues + ', rent payment ' + data.rent_payments + ', menu ' + data.food_menu + '.');
  loadAll();

window.restoreFile = () => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (f.size > 20 * 1024 * 1024) return toast('File bahut badi hai');
    try { await runRestore(JSON.parse(await f.text()), 'File'); } catch (e) { toast('File padhi nahi ja saki'); }
  };
  inp.click();
};
window.restoreSnapshot = async id => {
  const { data, error } = await sb.from('backups').select('data').eq('id', id).single();
  if (error) return toast(errMsg(error)); runRestore(data.data, 'Saved backup');
};

/* ===================== SETTINGS (Reports & Settings) ===================== */
function vSettings(){
  $('#view').innerHTML = `<h2 style="margin-top:0">Reports</h2>
  <div class="card"><button class="optbtn" style="border:0;border-radius:0;margin:0;background:none;border-bottom:1px solid var(--line)" onclick="go('report')">${ic('receipt')}<b>Report (PDF / Excel)</b></button>
  <button class="optbtn" style="border:0;border-radius:0;margin:0;background:none" onclick="go('chart')">${ic('chart')}<b>Analysis chart</b></button></div>
  <h2>Notifications</h2>
  <div class="card">
    <label class="sw"><input type="checkbox" ${S.prefs.announcements_on ? 'checked' : ''} onchange="setPref('announcements_on',this.checked)"><span>Announcement ke message (ON/OFF)</span></label>
    <label class="sw"><input type="checkbox" ${S.prefs.chat_on ? 'checked' : ''} onchange="setPref('chat_on',this.checked)"><span>Group message ke alert (ON/OFF)</span></label></div>
  <p class="hint">OFF karne par us ke naye message ka badge aur alert nahi aayega. Aap fir bhi screen kholkar padh sakte hain. App band hone par phone notification abhi nahi aati.</p>
  <h2>Account</h2>
  <div class="card"><div class="li"><div><div class="t">${esc(S.me.name)}</div><div class="s">Member ID: ${esc(S.me.username)}</div></div></div>
  <div class="li"><button class="btn ghost sm" onclick="changePass()">Apna password badlo</button></div></div>
  <p class="hint" style="text-align:center;margin-top:20px">Shahid Sharing</p>`;
}
window.setPref = async (col, val) => {
  S.prefs[col] = val;
  const { error } = await sb.from('member_prefs').upsert(prefsRow());
  if (error) toast(errMsg(error)); else render();
};
window.changePass = async () => {
  const p = prompt('Naya password (kam se kam 6 akshar):');
  if (!p) return;
  if (p.length < 6) return alert('Password chhota hai.');
  const { error } = await sb.auth.updateUser({ password:p });
  toast(error ? 'Password nahi badla' : 'Password badal gaya');
};

/* ---------- EXPENSE FORM (admin) ---------- */
window.expForm = id => {
  const e = id ? S.expenses.find(x => x.id === id) : null;
  const act = S.members.filter(m => m.active || (e && m.id === e.spender));
  const sel = e && e.split_members ? 'sel' : 'all';
  modal(`<h3>${e ? 'Kharcha edit karo' : 'Naya kharcha'}</h3>
  <form class="f" id="ef">
    <label>Kisne kharcha kiya</label>
    <select id="e_sp">${act.map(m => `<option value="${m.id}" ${(e ? e.spender : S.me.id) === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    <label>Raqam (${CURRENCY})</label>
    <input id="e_am" type="number" step="0.001" min="0.001" inputmode="decimal" value="${e ? e.amount : ''}" required>
    <label>Kis cheez ka</label>
    <input id="e_ds" value="${e ? esc(e.description) : ''}" placeholder="jaise: sabzi, chawal">
    <label>Category</label>
    <select id="e_ct">${CATS.map(c => `<option ${e && e.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <label>Tareekh</label>
    <input id="e_dt" type="date" value="${e ? e.date : todayStr()}" required>
    <label>Hissa kaise bantna hai</label>
    <div class="seg">
      <label><input type="radio" name="sm" value="all" ${sel === 'all' ? 'checked' : ''}> Sab me barabar</label>
      <label><input type="radio" name="sm" value="sel" ${sel === 'sel' ? 'checked' : ''}> Kuch members me</label>
    </div>
    <div class="chk" id="e_ch" style="${sel === 'sel' ? '' : 'display:none'}">${S.members.filter(m => m.active).map(m => `<label><input type="checkbox" value="${m.id}" ${e && e.split_members && e.split_members.includes(m.id) ? 'checked' : ''}> ${esc(m.name)}</label>`).join('')}</div>
    <div class="err" id="e_er" style="color:var(--give)"></div>
    <div class="row" style="margin-top:16px"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save karo</button></div>
  </form>`);
  document.querySelectorAll('input[name=sm]').forEach(r => r.onchange = () => { $('#e_ch').style.display = r.value === 'sel' && r.checked ? '' : 'none'; });
  $('#ef').onsubmit = async ev => {
    ev.preventDefault();
    const amount = parseFloat($('#e_am').value);
    if (!(amount > 0)) return ($('#e_er').textContent = 'Sahi raqam daalo.');
    const mode = document.querySelector('input[name=sm]:checked').value;
    let split = null;
    if (mode === 'sel'){
      split = [...document.querySelectorAll('#e_ch input:checked')].map(i => i.value);
      if (!split.length) return ($('#e_er').textContent = 'Kam se kam ek member chuno.');
    }
    const row = { spender:$('#e_sp').value, amount, description:$('#e_ds').value.trim(), category:$('#e_ct').value, date:$('#e_dt').value, split_members:split };
    const { error } = e ? await sb.from('expenses').update(row).eq('id', e.id) : await sb.from('expenses').insert(row);
    if (error) return ($('#e_er').textContent = 'Save nahi hua: ' + errMsg(error));
    closeModal(); toast('Save ho gaya'); loadAll();
  };
};
window.delExp = async id => {
  if (!confirm('Ye kharcha delete karna hai?')) return;
  const { error } = await sb.from('expenses').delete().eq('id', id);
  if (error) toast(errMsg(error)); else { toast('Delete ho gaya'); loadAll(); }
};

/* ---------- ADVANCE FORM (multi-select) ---------- */
window.xForm = id => {
  const t = id ? S.xfers.find(x => x.id === id) : null;
  const act = S.members.filter(m => m.active);
  const toOpts = sel => (sel ? '' : '<option value="">-- chuno --</option>') + S.members.filter(m => m.active || (t && m.id === t.to_member))
    .map(m => `<option value="${m.id}" ${sel === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
  const fromBlock = t
    ? `<label>Kisne paisa diya</label><select id="x_f">${S.members.filter(m => m.active || m.id === t.from_member).map(m => `<option value="${m.id}" ${t.from_member === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`
    : `<label>Kisne paisa diya (ek ya zyada member chuno)</label>
       <div class="row" style="margin-bottom:6px"><button type="button" class="btn ghost sm" id="x_all">Sab chuno</button><span id="x_cnt" class="hint"></span></div>
       <div class="chk" id="x_ch">${act.map(m => `<label><input type="checkbox" value="${m.id}"> ${esc(m.name)}</label>`).join('')}</div>`;
  modal(`<h3>${t ? 'Entry edit karo' : 'Naya advance / payment'}</h3>
  <form class="f" id="xf">
    ${fromBlock}
    <label>Kis ko diya (jiske paas paisa jama hua)</label>
    <select id="x_t" required>${toOpts(t ? t.to_member : '')}</select>
    <label>${t ? 'Raqam' : 'Har member ki raqam'} (${CURRENCY})</label>
    <input id="x_a" type="number" step="0.001" min="0.001" inputmode="decimal" value="${t ? t.amount : ''}" required>
    ${t ? '' : '<div class="hint" id="x_sum"></div>'}
    <label>Type</label>
    <select id="x_k"><option value="advance" ${!t || t.kind === 'advance' ? 'selected' : ''}>Advance (mahine ke liye jama)</option>
      <option value="settlement" ${t && t.kind === 'settlement' ? 'selected' : ''}>Settlement (purana hisaab chukaya)</option></select>
    <label>Tareekh</label><input id="x_d" type="date" value="${t ? t.date : todayStr()}" required>
    <label>Note (optional)</label><input id="x_n" value="${t ? esc(t.note) : ''}" placeholder="jaise: cash diya">
    <div class="err" id="x_e" style="color:var(--give)"></div>
    <div class="row" style="margin-top:16px"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" type="submit" id="x_bt">Save karo</button></div>
  </form>`);
  const chosen = () => { const to = $('#x_t').value; return [...document.querySelectorAll('#x_ch input:checked')].map(i => i.value).filter(v => v !== to); };
  const upd = () => { if (t) return; const n = chosen().length, a = parseFloat($('#x_a').value) || 0;
    $('#x_cnt').textContent = n + ' member chune';
    $('#x_sum').textContent = n && a ? `${n} x ${fmt(a)} = ${fmt(n * a)} ${CURRENCY} total (jis ko diya, uska naam apne aap hat jata hai)` : ''; };
  if (!t){
    $('#x_all').onclick = () => { const b = [...document.querySelectorAll('#x_ch input')], all = b.every(x => x.checked); b.forEach(x => x.checked = !all); upd(); };
    document.querySelectorAll('#x_ch input').forEach(b => b.onchange = upd); $('#x_a').oninput = upd; $('#x_t').onchange = upd; upd();
  }
  $('#xf').onsubmit = async ev => {
    ev.preventDefault();
    const to_member = $('#x_t').value, amount = parseFloat($('#x_a').value);
    const base = { to_member, amount, kind:$('#x_k').value, date:$('#x_d').value, note:$('#x_n').value.trim() };
    if (!to_member) return ($('#x_e').textContent = 'Jis ko paisa diya, wo member chuno.');
    if (!(amount > 0)) return ($('#x_e').textContent = 'Sahi raqam daalo.');
    let res;
    if (t){
      const from_member = $('#x_f').value;
      if (from_member === to_member) return ($('#x_e').textContent = 'Dene wala aur lene wala alag hone chahiye.');
      res = await sb.from('transfers').update({ ...base, from_member }).eq('id', t.id);
    } else {
      const ids = chosen();
      if (!ids.length) return ($('#x_e').textContent = 'Kam se kam ek dene wala member chuno.');
      $('#x_bt').disabled = true;
      res = await sb.from('transfers').insert(ids.map(f => ({ ...base, from_member:f })));
    }
    if (res.error){ $('#x_bt').disabled = false; return ($('#x_e').textContent = 'Save nahi hua: ' + errMsg(res.error)); }
    closeModal(); toast('Save ho gaya'); loadAll();
  };
};
window.delX = async id => {
  if (!confirm('Ye entry delete karni hai?')) return;
  const { error } = await sb.from('transfers').delete().eq('id', id);
  if (error) toast(errMsg(error)); else { toast('Delete ho gaya'); loadAll(); }
};

boot();
</script>
